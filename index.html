<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Landing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <nav class="p-4 bg-gray-900 text-white flex justify-between items-center">
        <a href="#" class="font-bold text-2xl">AIWeb</a>
        <ul class="hidden md:flex gap-6">
            <li class="hover:text-gray-300 transition"><a href="#">Home</a></li>
            <li class="hover:text-gray-300 transition"><a href="#">Features</a></li>
            <li class="hover:text-gray-300 transition"><a href="#">Contact</a></li>
        </ul>
        <div class="flex items-center gap-4">
            <button class="bg-yellow-700 px-4 py-2 rounded hover:bg-yellow-600 transition">Sign Up</button>
            <button id="menu-button" aria-label="Open menu" class="md:hidden text-2xl hover:text-yellow-300 transition">
                &#9776;
            </button>
        </div>
    </nav>
    <ul id="mobile-menu" class="hidden md:hidden bg-gray-900 text-white flex flex-col p-4">
        <li class="hover:text-gray-300 transition"><a href="#">Home</a></li>
        <li class="hover:text-gray-300 transition"><a href="#">Features</a></li>
        <li class="hover:text-gray-300 transition"><a href="#">Contact</a></li>
    </ul>
    <script>
        const button = document.getElementById("menu-button");
        const menu = document.getElementById("mobile-menu");
        button.addEventListener("click", function () {
            menu.classList.toggle("hidden");
            const isHidden = menu.classList.contains("hidden");
            if (isHidden) {
                button.textContent = "☰";
                button.setAttribute("aria-label", "Open menu");
            }
            else {
                button.textContent = "✖";
                button.setAttribute("aria-label", "Close menu");
            }
        });
    </script>
</body>

</html>
